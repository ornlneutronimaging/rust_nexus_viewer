[package]
name = "nexus_viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.35"
egui = "0.35"
egui_plot = "0.36"
hdf5-metno = "0.14.0"
ndarray = "0.17.2"
# gtk3 backend (not the default xdg-portal one): the portal ignores
# set_directory, so "start browsing here" would not work.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
